<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta name="theme-color" content="#ffffff" />

    <title>React Deckbuilder</title>

    <style>
      /* Pre-React shell: shown until the app mounts and replaces the contents of #root */
      body {
        background-color: #0c0a09; /* --color-stone-950 */
      }

      .boot-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100dvw;
        height: 100dvh;
        opacity: 0;
        animation: boot-shell-fade-in 0.3s ease-in-out 0.3s forwards;
      }

      .boot-shell__dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 100%;
        background-color: #a8a29e; /* --color-stone-400 */
        animation: boot-shell-pulse 1.25s ease-in-out infinite;
      }

      .boot-shell__dot:nth-child(2) {
        animation-delay: 0.15s;
      }

      .boot-shell__dot:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes boot-shell-fade-in {
        to {
          opacity: 1;
        }
      }

      @keyframes boot-shell-pulse {
        50% {
          opacity: 0.25;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-shell__dot {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root">
      <div class="boot-shell" role="status" aria-label="Loading">
        <span class="boot-shell__dot"></span>
        <span class="boot-shell__dot"></span>
        <span class="boot-shell__dot"></span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
